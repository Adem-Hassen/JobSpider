# OpenAI-compatible AI providers. Switch with AI_PROVIDER; no code change needed.
# Prices are USD per million tokens. Checked against provider docs on 2026-10-13:
#   https://console.groq.com/docs/models
#   https://api-docs.deepseek.com/quick_start/pricing
# Prices change; re-check them and run `jobfinder selfcheck` after edits.
#
# Per provider:
#   structured_output       strict_json_schema | json_object
#   reasoning_effort        per purpose (score, profile), if supported
#   max_output_tokens       per purpose; reasoning tokens count towards it
#   peak_windows_utc        when set, models with off_peak_price are billed at
#                           `price` inside these windows and `off_peak_price` outside
#   peak_exempt_dates       dates billed off-peak all day (e.g. provider holidays);
#                           left empty, costs are over- rather than under-estimated
# Per model:
#   price, off_peak_price   {input, cached_input, output}
#   extra_body              extra request fields sent with every call

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    structured_output: strict_json_schema
    supports_reasoning_effort: true
    reasoning_effort: {score: low, profile: medium}
    max_output_tokens: {score: 2048, profile: 8192}
    default_models: {score: openai/gpt-oss-120b, profile: openai/gpt-oss-120b}
    models:
      openai/gpt-oss-120b:
        # No cached-input price published; billed as full input (conservative).
        price: {input: 0.15, cached_input: 0.15, output: 0.60}
        extra_body: {include_reasoning: false}
      qwen/qwen3.8-27b:
        # Groq preview model: evaluation only, may be withdrawn at short notice.
        price: {input: 0.80, cached_input: 0.80, output: 4.00}
        extra_body: {reasoning_format: hidden}

  deepseek:
    base_url: https://api.deepseek.com
    structured_output: json_object
    # Thinking is on by default at effort "high" and billed as output; DeepSeek
    # accepts low | high | max.
    supports_reasoning_effort: true
    reasoning_effort: {score: low, profile: high}
    max_output_tokens: {score: 4096, profile: 8192}
    default_models: {score: deepseek-v4-pro, profile: deepseek-v4-pro}
    peak_windows_utc:
      - {days: [mon, tue, wed, thu, fri], start: "01:00", end: "04:00"}
      - {days: [mon, tue, wed, thu, fri], start: "06:00", end: "10:00"}
    # Chinese public holidays are off-peak; add them here to price them correctly.
    peak_exempt_dates: []
    models:
      deepseek-v4-pro:
        price: {input: 1.32, cached_input: 0.044, output: 3.96}
        off_peak_price: {input: 0.66, cached_input: 0.022, output: 1.98}
      deepseek-flash:
        price: {input: 0.30, cached_input: 0.006, output: 1.20}
        off_peak_price: {input: 0.15, cached_input: 0.003, output: 0.60}

# Models compared by `jobfinder eval`.
eval_models:
  - {provider: groq, model: openai/gpt-oss-120b}
  - {provider: groq, model: qwen/qwen3.8-27b}
  - {provider: deepseek, model: deepseek-v4-pro}
  - {provider: deepseek, model: deepseek-flash}
